<div class="page container">
  <app-breadcrumbs [items]="[{ label: 'Benefits' }]" />
  <app-page-header
    title="Benefits of Training"
    lead="Many practitioners report positive effects. This is general information, not medical advice."
  />
  <div class="callout" role="note">
    Individual experiences vary. Consult a healthcare provider before starting any new exercise program.
  </div>
  @for (cat of categories; track cat.title) {
    <section class="card">
      <h2>{{ cat.title }}</h2>
      <ul>
        @for (item of cat.items; track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </section>
  }
</div>
