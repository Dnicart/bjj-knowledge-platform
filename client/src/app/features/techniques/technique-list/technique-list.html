<div class="page container">
  <app-breadcrumbs [items]="[{ label: 'Techniques' }]" />
  <app-page-header
    title="Technique Library"
    lead="Search and filter 12 beginner-friendly techniques covering escapes, sweeps, passes, and submissions."
  />

  <div class="technique-list__layout">
    <aside class="technique-list__sidebar">
      <app-search-field
        inputId="technique-search"
        label="Search techniques"
        placeholder="Search by name..."
        [value]="filters().query"
        (valueChange)="onSearch($event)"
      />
      <app-technique-filters
        [filters]="filters()"
        (filtersChange)="onFiltersChange($event)"
        (clear)="clearFilters()"
      />
    </aside>

    <div class="technique-list__main">
      <p class="technique-list__count" aria-live="polite" aria-atomic="true">
        {{ techniques().length }} technique{{ techniques().length === 1 ? '' : 's' }} found
      </p>

      @if (techniques().length) {
        <div class="card-grid">
          @for (technique of techniques(); track technique.slug) {
            <app-technique-card [technique]="technique" />
          }
        </div>
      } @else {
        <app-empty-state title="No techniques match your filters" message="Try adjusting your search or filters.">
          <button type="button" class="btn btn--primary" (click)="clearFilters()">Clear filters</button>
        </app-empty-state>
      }
    </div>
  </div>
</div>
